#
# CI for ios-car-writer (Phase 243 Plan 03, D-05/D-07/D-08).
#
# Builds car_roundtrip as a fully static musl binary inside an Alpine
# container (matching .do/Dockerfile's own base OS -- no glibc/musl ABI
# mismatch is possible), gates on a green GoogleTest run (ctest), and
# verifies the linked binary is actually static before anything else runs.
# zlib and libpng are the build dependencies (see Libraries/libcar/CMakeLists.txt
# -- the `patch` verb decodes master PNGs; both are linked statically, no
# libxml2 link is required).
#
# Triggered by a pinned tag push or manual dispatch.
#
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: apk add --no-cache build-base cmake zlib-dev zlib-static libpng-dev libpng-static git file

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (static link, tests on)
        run: |
          # Resolve libpng's static archive + header dir (musl/Alpine layout).
          # Pinning the .a is required: FindPNG defaults to the .so, which a
          # fully static (-static) link cannot consume.
          PNG_STATIC=$(ls /usr/lib/libpng16.a /usr/lib/libpng.a 2>/dev/null | head -1)
          test -n "$PNG_STATIC" || { echo "libpng static archive not found"; exit 1; }
          PNG_INCLUDE=$(dirname "$(find /usr/include -name png.h | head -1)")
          test -n "$PNG_INCLUDE" || { echo "png.h not found"; exit 1; }
          echo "Using PNG_LIBRARY=$PNG_STATIC PNG_PNG_INCLUDE_DIR=$PNG_INCLUDE"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DZLIB_LIBRARY=/lib/libz.a \
            -DZLIB_INCLUDE_DIR=/usr/include \
            -DPNG_LIBRARY="$PNG_STATIC" \
            -DPNG_PNG_INCLUDE_DIR="$PNG_INCLUDE" \
            -DBUILD_TESTING=ON \
            .

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run GoogleTest suite (hard gate)
        run: ctest --test-dir build --output-on-failure

      - name: Verify static-musl link
        run: |
          # file(1) is the authoritative, safe check here. ldd(1) is
          # deliberately not used: on a genuinely static ELF there is no
          # dynamic loader to intercept LD_TRACE_LOADED_OBJECTS, so some
          # ldd implementations fall back to exec()-ing the binary being
          # inspected -- unsafe for a build artifact under test.
          file build/car_roundtrip
          file build/car_roundtrip | grep -q "statically linked"

      - name: Run car_roundtrip against the real fixture (execution proof)
        run: |
          ./build/car_roundtrip roundtrip --source Tests/fixtures/shell/Assets.car --out /tmp/rt.car
          ./build/car_roundtrip verify --source Tests/fixtures/shell/Assets.car --out /tmp/rt.car

      - name: Stage release asset
        run: |
          mkdir -p dist
          cp build/car_roundtrip dist/car-writer-x86_64-linux-musl
          cd dist && sha256sum car-writer-x86_64-linux-musl > car-writer-x86_64-linux-musl.sha256
          cat car-writer-x86_64-linux-musl.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-writer-x86_64-linux-musl
          path: |
            dist/car-writer-x86_64-linux-musl
            dist/car-writer-x86_64-linux-musl.sha256

  # Publishes the artifact staged by `build` as a GitHub release asset.
  # Only runs on a pinned tag push (D-05) -- workflow_dispatch runs build
  # and test only, never publishes.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: car-writer-x86_64-linux-musl
          path: dist

      - name: Read sha256
        id: sha
        run: echo "sha256=$(cut -d' ' -f1 dist/car-writer-x86_64-linux-musl.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/car-writer-x86_64-linux-musl
            dist/car-writer-x86_64-linux-musl.sha256
          body: |
            car-writer static-musl binary, built inside an Alpine container
            with a full static link (zlib is the only real dependency).

            sha256 (car-writer-x86_64-linux-musl): ${{ steps.sha.outputs.sha256 }}
